# FAST research group PrusaSlicer profile for the Modix Big-120Z V4.
# Settings not listed here take PrusaSlicer 2.9.7 defaults.
# SPDX-License-Identifier: MIT
bed_shape = 0x0,600x0,600x600,0x600
bottom_fill_pattern = rectilinear
bridge_angle = 90
bridge_speed = 40
brim_type = no_brim
brim_width = 3
cooling = 0
disable_fan_first_layers = 4
enable_dynamic_overhang_speeds = 1
end_gcode = ; FAST end: Modix V4, RepRapFirmware\nM106 S0 ; part cooling fan off\nG10 P0 S0 R0 ; tool 0 heater off (active and standby)\nG10 P1 S0 R0 ; tool 1 heater off (active and standby)\nG28 X Y ; park the head at the X/Y endstops\nT-1 P0 ; release the tool, skip the tool-change macros\nM84 X Y ; let X and Y go idle; Z keeps holding\nM300 S1000 P800 ; tone: print finished\n
external_perimeter_speed = 30
fan_below_layer_time = 200
filament_colour = #479401
filament_cost = 62
filament_density = 1.25
filament_settings_id = "FAST PETG (Modix 0.8)"
filament_type = PETG
fill_pattern = rectilinear
first_layer_extrusion_width = 0
first_layer_height = 0.4
first_layer_temperature = 245
gcode_flavor = reprapfirmware
infill_speed = 60
layer_height = 0.4
machine_limits_usage = ignore
max_fan_speed = 50
max_layer_height = 0.8
max_print_height = 1200
max_print_speed = 200
min_fan_speed = 0
min_layer_height = 0.05
nozzle_diameter = 0.8
overhang_speed_0 = 10
overhang_speed_3 = 20
perimeter_speed = 40
print_settings_id = FAST 0.8 PETG
printer_settings_id = FAST Modix Big-120Z V4 single 0.8 PETG
raft_first_layer_density = 100%
raft_first_layer_expansion = 1
retract_length = 0.6
retract_lift = 0.5
retract_speed = 30
skirt_distance = 2
skirts = 3
slowdown_below_layer_time = 1
small_perimeter_speed = 20
solid_infill_below_area = 20
solid_infill_speed = 40
start_gcode = ; FAST start: Modix V4, one extruder, RepRapFirmware\nG28 ; home X, Y and Z\nT0 ; make tool 0 active so its heater and offsets apply\n
support_material = 1
support_material_interface_layers = 2
support_material_interface_speed = 30
support_material_spacing = 3
support_material_style = snug
support_material_with_sheath = 0
support_material_xy_spacing = 150%
temperature = 240
thick_bridges = 0
thumbnails = 400x400/PNG, 160x160/PNG
top_fill_pattern = rectilinear
top_solid_infill_speed = 20
travel_speed = 150
variable_layer_height = 0
