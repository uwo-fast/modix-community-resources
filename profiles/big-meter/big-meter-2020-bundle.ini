# FAST research group PrusaSlicer profile for the Modix Big-Meter.
# Settings not listed here take PrusaSlicer 2.9.7 defaults.
# SPDX-License-Identifier: MIT

[print:FAST 0.4 standard (2020)]
bottom_fill_pattern = rectilinear
ensure_vertical_shell_thickness = partial
fill_pattern = grid
first_layer_extrusion_width = 0
first_layer_height = 0.15
infill_overlap = 15%
infill_speed = 60
layer_height = 0.2
only_retract_when_crossing_perimeters = 1
seam_position = nearest
skirt_distance = 10
skirts = 4
small_perimeter_speed = 25%
solid_infill_below_area = 20
solid_infill_speed = 80%
support_material_extrusion_width = 0.35
support_material_speed = 30
top_fill_pattern = rectilinear
top_solid_infill_speed = 50%
travel_speed = 80

[filament:FAST PLA (Modix 2020)]
disable_fan_first_layers = 1
fan_below_layer_time = 200
filament_colour = #DB00C5
filament_cost = 62
filament_density = 1.25
first_layer_temperature = 215
slowdown_below_layer_time = 1
temperature = 215

[printer:FAST Modix Big-Meter single 0.4 (2020)]
bed_shape = 0x0,1010x0,1010x1010,0x1010
end_gcode = ; FAST end: Modix (2020 profile)\nM104 T0 S0 ; extruder 1 heater off\nM104 T1 S0 ; extruder 2 heater off\nG91 ; relative positioning\nG1 Z2 F600 ; raise the nozzle 2 mm off the part\nG90 ; absolute positioning\nG28 X Y ; park at the X/Y endstops\nM18 ; all motors idle\n
max_print_height = 1010
min_layer_height = 0.05
retract_lift = 2
use_relative_e_distances = 1
variable_layer_height = 0

[printer:FAST Modix Big-Meter dual 0.4 (2020)]
bed_shape = 0x0,1010x0,1010x1010,0x1010
end_gcode = ; FAST end: Modix (2020 profile)\nM104 T0 S0 ; extruder 1 heater off\nM104 T1 S0 ; extruder 2 heater off\nG91 ; relative positioning\nG1 Z2 F600 ; raise the nozzle 2 mm off the part\nG90 ; absolute positioning\nG28 X Y ; park at the X/Y endstops\nM18 ; all motors idle\n
max_print_height = 1010
min_layer_height = 0.05,0.05
nozzle_diameter = 0.4,0.4
retract_lift = 2,2
use_relative_e_distances = 1
variable_layer_height = 0

[presets]
print = FAST 0.4 standard (2020)
filament = FAST PLA (Modix 2020)
filament_1 = FAST PLA (Modix 2020)
printer = FAST Modix Big-Meter dual 0.4 (2020)
