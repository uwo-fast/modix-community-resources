# FAST research group PrusaSlicer profile for the Modix Big-120Z V4 IDEX.
# Settings not listed here take PrusaSlicer 2.9.7 defaults.
# SPDX-License-Identifier: MIT
bed_shape = 0x0,600x0,600x650,0x650
bottom_solid_layers = 2
bridge_fan_speed = 0,100
bridge_speed = 40
brim_type = outer_and_inner
cooling = 0,0
disable_fan_first_layers = 1,1
elefant_foot_compensation = 0.2
enable_dynamic_overhang_speeds = 1
end_gcode = ; FAST end: Modix V4 IDEX, RepRapFirmware\nM106 S0 ; part cooling fan off\nT1 ; take the second carriage\nM83 ; extruder moves are relative\nG1 E-50 F2400 ; draw the second tool's filament back 50 mm\nG10 P0 S0 R0 ; tool 0 heater off (active and standby)\nG10 P1 S0 R0 ; tool 1 heater off (active and standby)\nG28 X U Y ; park both carriages and Y at their endstops\nT-1 P0 ; release the tool, skip the tool-change macros\nM84 X U Y ; let X, U and Y go idle; Z keeps holding\nM300 S1000 P800 ; tone: print finished\n
external_perimeter_speed = 40
extruder_colour = "";#FFFF00
fan_always_on = 0,1
fan_below_layer_time = 200,200
filament_colour = #3CA7FF;#CDFEA0
filament_cost = 62,62
filament_density = 1.25,1.25
filament_retract_length = 1.2,nil
filament_settings_id = "FAST PETG (Modix IDEX)";"FAST PLA support (Modix IDEX)"
filament_type = PET;PLA
fill_density = 10%
fill_pattern = rectilinear
first_layer_extrusion_width = 0
first_layer_height = 0.32
first_layer_temperature = 240,210
gcode_flavor = reprapfirmware
layer_height = 0.32
machine_limits_usage = ignore
max_layer_height = 0.6,0.6
max_print_height = 1200
max_print_speed = 350
min_fan_speed = 15,100
min_layer_height = 0.2,0.2
nozzle_diameter = 0.8,0.8
overhang_speed_0 = 20
overhang_speed_1 = 20
overhang_speed_2 = 25
overhang_speed_3 = 30
perimeters = 2
print_settings_id = FAST 0.8 IDEX PETG + PLA support
printer_settings_id = FAST Modix Big-120Z V4 IDEX 0.8
raft_first_layer_density = 100%
raft_first_layer_expansion = 0
retract_length = 0.4,0.4
retract_length_toolchange = 0,0
retract_lift = 1,1
retract_restart_extra = 0.4,0.4
silent_mode = 0
single_extruder_multi_material_priming = 0
skirt_distance = 2
skirts = 2
slowdown_below_layer_time = 1,1
small_perimeter_speed = 30
solid_infill_speed = 60
start_filament_gcode = "; FAST: this tool idles at 150 C while the other carriage prints\nG10 P{filament_extruder_id} S{temperature[filament_extruder_id]} R150\n";"; Filament gcode\n"
start_gcode = ; FAST start: Modix V4 IDEX, RepRapFirmware\nG28 ; home X, U, Y and Z\nT0 ; begin on the first carriage\nG0 Z5 F3000 ; nozzle 5 mm above the bed\n
support_material = 1
support_material_angle = 90
support_material_contact_distance = 0
support_material_extruder = 2
support_material_interface_extruder = 2
support_material_interface_speed = 40
support_material_spacing = 3
support_material_speed = 80
support_material_style = snug
support_material_synchronize_layers = 1
support_material_with_sheath = 0
support_material_xy_spacing = 100%
temperature = 240,210
thick_bridges = 0
thumbnails = 300x300/PNG, 32x32/PNG
top_solid_infill_speed = 40
travel_speed = 300
use_relative_e_distances = 1
variable_layer_height = 0
wipe_tower = 1
wipe_tower_brim_width = 1
wipe_tower_width = 50
